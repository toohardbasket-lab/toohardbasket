name: Update dataset

on:
  schedule:
    - cron: "0 22 * * 1"   # Tuesdays 06:00 Perth (UTC+8)
  workflow_dispatch:

# contents: to commit the rebuilt dataset. issues: to raise the alarm when a
# run fails — without it the alarm step fails silently and a broken weekly job
# looks like a quiet one, which is how a register goes stale unnoticed.
permissions:
  contents: write
  issues: write

# One run at a time. A manual dispatch while the Tuesday run is still going
# would have two jobs rebuilding the same files and pushing over each other.
concurrency:
  group: update-dataset
  cancel-in-progress: false

defaults:
  run:
    working-directory: scraper   # scripts + data/ + raw/ all live under scraper/

jobs:
  update:
    runs-on: ubuntu-latest
    # Every date this job writes — "as at" on the front page, each row's days
    # outstanding, the edition file and its tag — is worked out from "today".
    # GitHub's runners keep UTC, and the Tuesday 06:00 Perth run starts at
    # 22:00 UTC on Monday, so without this the site would date Tuesday's build
    # Monday and count every wait a day short of the Canberra calendar. The
    # registers are kept in the Parliament's own time.
    env:
      TZ: Australia/Canberra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Tesseract is here for the response corpus: a scanned response with no
      # text layer would otherwise be classified "unreadable", which counts it
      # in the corpus as neither a closure nor a substantive response and so
      # understates the closure rate.
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      # Pinned in scraper/requirements.txt. What these libraries do with an
      # awkward PDF or a malformed tag IS the dataset, so an upgrade has to be
      # a decision someone took rather than whatever shipped that morning.
      - run: pip install -r requirements.txt && playwright install chromium --with-deps
      - name: Parser tests (gate)
        run: python tests/test_parser.py
      - name: Build dataset
        run: python build_dataset.py --all
      - name: Fetch any new President's report
        run: python harvest_schedules.py
      - name: Build the Senate register
        run: python build_ledger.py && python build_ledger_v2.py
      - name: Build the House register
        run: python build_house_ledger.py
      # OTD's own report-to-response links, then the links from each register
      # row to its report, then the removal of every report answered since the
      # schedules were printed. The removal is the step that keeps an answered
      # report off the register; it has to run every week, on both chambers.
      # The removal step can only take off a report whose response it has seen,
      # so the list of tabled responses is refreshed BEFORE the links and the
      # removal. Without this the job rebuilt both registers every week against
      # a response list that only a hand-run sweep updated.
      - name: Harvest responses tabled since the last run
        run: python harvest_responses.py
      - name: Link reports to their responses
        run: python harvest_links.py && python link_reports.py
      # The closure figures the home page leads with are computed from this
      # file. Until this step existed, only a hand-run sweep wrote it, so the
      # published rate froze on whatever day that sweep was last run and
      # nothing on the site said so. The refresh enumerates every response
      # document OTD holds and classifies only the ones not already on file.
      - name: Refresh-step tests (gate)
        run: python tests/test_refresh.py
      - name: Classify newly tabled responses
        run: python otd_sweep.py --refresh
      # Recomputed after the classification, so the floor moves with the corpus
      # rather than being a figure someone worked out once.
      - name: Count the recommendations each closure can prove
        run: python count_recommendations.py
      # The searchable index. The reports are read first because a report that
      # has just come off a register still belongs in it; the verification step
      # then drops anything that cannot be found verbatim under its own number
      # in the document it claims, so what publishes is checked by construction.
      - name: Read the reports on the registers
        run: python harvest_report_pdfs.py
      # Keeps the list of reports the Tabled Documents register cannot supply in
      # step with the registers, and reads any PDFs that have been collected
      # since the last run (fetch_manual_reports.py collects them from the
      # committees' own pages; this step only reads what is on disk).
      - name: Read the reports collected by hand
        run: python harvest_manual_reports.py
      - name: Author-attribution tests (gate)
        run: python tests/test_report_authors.py
      # Three steps between the two extractors: which report each response
      # answers, then the text of every report whose response quotes none of
      # its recommendations, so those recommendations can be shown too — with
      # the fact that the response does not address them one by one.
      - name: Extract recommendations
        run: |
          python extract_recommendations.py
          python link_responses_to_reports.py
          python harvest_report_pdfs.py --answered
          python extract_report_recommendations.py
      - name: Verify every recommendation against its source (gate)
        run: python verify_recommendations.py
      # For each recommendation the index holds: did the response state a
      # position on it? A mechanical test (tests/test_coverage.py says what it
      # must and must not count), written out per recommendation and per
      # response so the search page and the responses page read one file.
      - name: Stated-position tests (gate)
        run: python tests/test_coverage.py
      - name: Measure coverage
        run: python coverage.py
      - name: Removal-step tests (gate)
        run: python tests/test_answered_since.py
      - name: Remove reports answered since the schedules
        run: python prune_answered.py
      - name: Mark the reports that are on both registers
        run: python cross_register.py
      # What the President has said about each report, edition by edition. This
      # is what licenses any claim about how long, as against how many.
      - name: Read the back run of schedules
        run: python build_status_history.py
      - name: Build backlog history
        run: python build_history.py
      # Redrawn every week from the files the pages are built from, so the card
      # a journalist sees when the link is pasted into Slack carries this
      # week's numbers and this week's "checked to" date rather than whatever
      # was true when someone last made one by hand.
      - name: Draw the link preview card
        run: python make_og_card.py
      # The last gate, and the only one that tests the dataset rather than a
      # step. Every check here is a claim the site is about to publish: that
      # every response has been read, that the removals are counted and listed
      # alike, that the registers and the index are not empty. A job that fails
      # loudly is a good week; a job that succeeds while publishing a figure
      # that quietly stopped moving is the failure this project cannot afford.
      - name: Is the dataset fit to publish (gate)
        run: python check_publishable.py
      # The site is built from these files by Cloudflare Pages on push, and a
      # data file that breaks the build would leave last week's site up with
      # nothing to say so — Pages' own failure is visible only in its dashboard.
      # Building here first makes a broken build a failed run, which opens an
      # issue, rather than a silent week.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: The site builds from this dataset (gate)
        working-directory: site
        run: npm ci && npx astro build
      # A dated record of what this build said, published at /as-at/<date>/ so
      # a figure quoted from the site stays reachable at the page that showed
      # it. Written after the gate, so only a publishable build becomes an
      # edition, and the commit is tagged so the dataset behind it can be found.
      - name: Record this edition
        run: python snapshot_edition.py
      # The most reportable thing this dataset holds is a day, not a number: a
      # sitting Tuesday on which the government tables a stack of responses and
      # most of them close the report with the passage-of-time sentence. Those
      # days were being found weeks later by looking. This finds them the morning
      # the dataset is rebuilt; the step below turns the note into an issue,
      # which is an email. Days already reported are recorded in
      # data/alerted_batches.json and are never reported twice.
      - name: A batch of closures in one day
        run: python batch_alert.py

      - name: Raise the batch as an issue
        if: hashFiles('/tmp/batch_alert.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('/tmp/batch_alert.md', 'utf8');
            const cut = raw.indexOf('\n---\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: raw.slice(0, cut).trim(),
              body: raw.slice(cut + 5).trim()
                  + `\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`
                  + `/actions/runs/${context.runId}`,
            });

      # Falling back to the cached StatsNet cells keeps the build green when
      # aph.gov.au refuses us, which is right for a week and wrong for two
      # months: the site keeps publishing while the compliance series quietly
      # stops moving. This says so, once a fortnight, until it is fixed.
      # scraper/data/statsnet_freshness.json records the last date the live
      # page actually gave us each year; the commit step below picks it up
      # with the rest of data/.
      - name: Quiet-register tests (gate)
        run: python tests/test_statsnet_alert.py

      - name: The Senate register has gone quiet
        run: python statsnet_alert.py

      - name: Raise the quiet register as an issue
        if: hashFiles('/tmp/statsnet_alert.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('/tmp/statsnet_alert.md', 'utf8');
            const cut = raw.indexOf('\n---\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: raw.slice(0, cut).trim(),
              body: raw.slice(cut + 5).trim()
                  + `\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`
                  + `/actions/runs/${context.runId}`,
            });

      - name: Commit on green
        run: |
          git config user.name "thb-bot"
          git config user.email "bot@toohardbasket.org.au"
          git add data/ raw/ ../site/public/og.png
          git diff --cached --quiet && { echo "No change to the dataset."; exit 0; }
          git commit -m "Dataset update $(date +%F)"
          # A push can be refused because main moved while the job was running,
          # or because the run was started against an older commit. Rebasing
          # the data commit onto the current tip is safe — this job only ever
          # writes data/ and raw/, and it rebuilds both from source every run.
          git push || {
            echo "Push refused; rebasing onto the current main and retrying."
            git pull --rebase origin main
            git push
          }
          # The edition tag points at the commit that carries the edition file,
          # so /as-at/<date>/ can link to the whole dataset behind it. Forced,
          # because a second run on the same day replaces that day's edition.
          git tag -f "edition-$(date +%F)"
          git push -f origin "edition-$(date +%F)"
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Dataset build failed ${new Date().toISOString().slice(0,10)}`,
              body: `Validation or scrape failed — the site must NOT be updated until this is resolved.\n\n`
                  + `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n`
                  + `Commit: ${context.sha}\n\n`
                  + `The published site still shows the previous build, which is the intended behaviour: `
                  + `nothing is committed unless every step passes. Fix the failing step and re-run.`
            })
