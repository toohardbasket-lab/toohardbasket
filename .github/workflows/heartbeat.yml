name: Did the weekly run happen

# The dataset job opens an issue when a run FAILS. Nothing tells you about a
# run that never STARTED — and that is a real state: GitHub skips scheduled
# runs under load, and disables scheduled workflows on a repository with no
# activity for sixty days. A register that quietly stops being rebuilt looks
# exactly like a register with nothing to report.
#
# So this runs a day after the dataset job and asks one question: has "Update
# dataset" succeeded in the last eight days? If not, it opens an issue and
# fails, which GitHub emails you about.
#
# What this cannot catch: if GitHub disables scheduled workflows on this
# repository, it disables this one too, and the silence is complete. An
# external switch (healthchecks.io) survives that; this one is free, needs no
# third party, and catches everything short of it.

on:
  schedule:
    - cron: "0 22 * * 2"   # Wednesdays 06:00 Perth — a day after the rebuild
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: The dataset job has succeeded within eight days
        uses: actions/github-script@v7
        with:
          script: |
            const DAYS = 8;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "update-dataset.yml",
              status: "success",
              per_page: 1,
            });
            const last = runs.data.workflow_runs[0];
            const when = last ? new Date(last.updated_at) : null;
            const age = when ? (Date.now() - when.getTime()) / 86400000 : Infinity;
            if (age <= DAYS) {
              core.info(`Last successful rebuild ${age.toFixed(1)} days ago — fine.`);
              return;
            }
            const said = when
              ? `The last successful rebuild was ${when.toISOString().slice(0, 10)}, ` +
                `${age.toFixed(0)} days ago.`
              : `No successful rebuild has ever been recorded.`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `The weekly rebuild has not run ${new Date().toISOString().slice(0, 10)}`,
              body: `${said}\n\n`
                  + `The site is still up and still shows the last dataset that was built, `
                  + `so nothing is wrong on the page — but every day count on it is being `
                  + `recomputed from a register that may have moved.\n\n`
                  + `Check https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/update-dataset.yml. `
                  + `If the schedule has been disabled (GitHub does this after sixty days `
                  + `without repository activity), re-enable it there; otherwise dispatch a `
                  + `run by hand and read the log.`
            });
            core.setFailed(said);
